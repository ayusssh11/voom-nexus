name: Voom Nexus Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * 1' # Weekly security audit every Monday at 02:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  security-analysis:
    name: SAST & Supply Chain Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --package-lock-only

      - name: Execute Voom Nexus Security Scan
        run: |
          npx vibesec scan . \
            --format sarif \
            --output voomsec-results.sarif \
            --threshold HIGH \
            --audit

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: voomsec-results.sarif
          category: voom-nexus-security
