name: Voom Nexus Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * 1' # Weekly security audit every Monday at 02:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  security-analysis:
    name: SAST & Supply Chain Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Monorepo
        run: npm run build

      - name: Execute Voom Nexus Security Scan
        run: |
          node apps/cli/dist/index.js scan apps packages \
            --format sarif \
            --output voomsec-results.sarif \
            --threshold CRITICAL \
            --audit || true

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: voomsec-results.sarif
          category: voom-nexus-security
